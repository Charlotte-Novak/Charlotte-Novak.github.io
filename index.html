  <main>
    
    <div id="main-content" class="content-box" style="margin-top: 60px; margin-bottom: 120px;">
      <!-- top.html 會自動載入這裡 -->
    </div>
  </main>

  <script>
    // ==================== 全域變數 ====================
    let homeContent = '';   // 用來保存 top.html 的原始內容，供 loadHome() 切換使用

    // ==================== 載入首頁 (Top) ====================
    function loadTop() {
      const contentArea = document.getElementById('main-content');
      
      fetch('top.html')
        .then(r => {
          if (!r.ok) throw new Error('top.html 載入失敗');
          return r.text();
        })
        .then(html => {
          contentArea.innerHTML = html;
          homeContent = html;           // 保存內容
        })
        .catch(() => {
          contentArea.innerHTML = `<h1>Top</h1><p>top.html 載入失敗，請確認檔案存在。</p>`;
        });
    }

    // ==================== 點擊「Top」時切換回首頁 ====================
    function loadHome() {
      if (homeContent) {
        document.getElementById('main-content').innerHTML = homeContent;
      }
      updateActive('loadHome');
    }

    // ==================== 載入其他頁面內容 (python-automation、thoughts 等) ====================
    function loadContent(page) {
      const contentArea = document.getElementById('main-content');
      
      fetch(`${page}.html`)
        .then(r => {
          if (!r.ok) throw new Error('檔案不存在');
          return r.text();
        })
        .then(html => {
          contentArea.innerHTML = html;
        })
        .catch(() => {
          contentArea.innerHTML = `<h1>${page}</h1><p>內容開發中...</p>`;
        });
      
      updateActive(page);
    }

    // ==================== 更新左側選單的 active 狀態 ====================
    function updateActive(identifier) {
      document.querySelectorAll('.nav-link').forEach(link => {
        link.classList.remove('active');
        if (identifier === 'loadHome' && link.getAttribute('onclick')?.includes('loadHome')) {
          link.classList.add('active');
        }
      });
    }

    // ==================== 頁面初始化 ====================
    document.addEventListener('DOMContentLoaded', () => {
      loadTop();                    // 頁面載入時自動載入 top.html

      // 折疊選單功能
      document.querySelectorAll('.toggle-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const target = document.getElementById(btn.dataset.target);
          if (target) {
            const isOpen = target.classList.toggle('open');
            btn.classList.toggle('active', isOpen);
          }
        });
      });
    });
  </script>
