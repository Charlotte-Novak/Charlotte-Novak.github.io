<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charlotte Novak 的學習筆記</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

  

    .container {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 260px;
      background: rgba(255, 255, 255, 0.93);
      backdrop-filter: blur(12px);
      padding: 24px 0;
      border-right: 1px solid rgba(0,0,0,0.1);
      position: fixed;
      height: 100vh;
      overflow-y: auto;
    }

    .content {
      flex: 1;
      margin-left: 260px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.96);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      padding: 0 20px 24px;
      border-bottom: 1px solid #eee;
      margin-bottom: 20px;
      color: #2c3e50;
    }

    .nav-link {
      display: block;
      padding: 10px 20px;
      color: #333;
      text-decoration: none;
      transition: all 0.2s;
    }

    .nav-link:hover, .nav-link.active {
      background: #4A6CF7;
      color: white;
    }

    .section-title {
      display: block;
      padding: 8px 20px 4px;
      font-size: 0.85rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .sub {
      padding-left: 40px;
      font-size: 0.95rem;
    }

   
  </style>
</head>


  
  
  <body background="images/Fearther.jpg">
  <div class="container">
    <!-- 左側 Sidebar -->
    <nav class="sidebar">
      <div class="logo">Menu</div>
      
      <a href="#" class="nav-link active" onclick="loadContent('home')">Top</a>
      
      <div class="nav-section">
        <span class="section-title">Python Notes</span>
        <a href="#" class="nav-link sub" onclick="loadContent('python-basics')">• 基礎語法</a>
        <a href="#" class="nav-link sub" onclick="loadContent('python-automation')">• 自動化腳本</a>
        <a href="#" class="nav-link sub" onclick="loadContent('python-projects')">• 專案實戰</a>
      </div>

      <div class="nav-section">
        <span class="section-title">MacOS Tricks</span>
        <a href="#" class="nav-link sub" onclick="loadContent('mac-tricks')">• 使用技巧</a>
        <a href="#" class="nav-link sub" onclick="loadContent('mac-automation')">• 自動化工具</a>
      </div>

      <a href="#" class="nav-link" onclick="loadContent('thoughts')">碎碎念</a>
      <a href="#" class="nav-link" onclick="loadContent('about')">About Me</a>
    </nav>

    <!-- 右側內容區 -->
    <main class="content" id="main-content">
      <!-- 預設載入首頁內容 -->
    
      <p>我的學習 Python 過程紀錄，以及在 Mac 上的小實驗與自動化工具的筆記。</p>
      <p>一個intj，跟Grok之間的吐槽日常～</p>
      <p>網站正在逐步完善中...這得看我學習進度</p>
    </main>
  </div>

  <script>
    function loadContent(page) {
      const content = document.getElementById('main-content');
      
      // 這裡之後可以改成 fetch 外部 html 檔案
      if (page === 'home') {
        content.innerHTML = `<h1>歡迎來到我的學習筆記</h1><p>Python + Mac + AI 碎碎念 實錄</p>`;
      } else if (page === 'python-basics') {
        content.innerHTML = `<h1>Python 基礎語法</h1><p>這裡會放基礎筆記...</p>`;
      } else if (page === 'python-automation') {
        content.innerHTML = `<h1>Python 自動化腳本</h1><p>Mac 自動化相關...</p>`;
      } else {
        content.innerHTML = `<h1>${page}</h1><p>內容開發中...</p>`;
      }
    }
  </script>
</body>
</html>
