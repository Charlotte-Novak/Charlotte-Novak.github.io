<script>
    // 保存最初的首頁內容
    let homeContent = document.getElementById('main-content').innerHTML;

    function loadHome() {
      document.getElementById('main-content').innerHTML = homeContent;
      
      document.querySelectorAll('.nav-link').forEach(link => {
        link.classList.remove('active');
      });
      document.querySelector('a[onclick="loadHome()"]').classList.add('active');
    }

    function loadContent(page) {
      const content = document.getElementById('main-content');
      
      fetch(`${page}.html`)
        .then(response => {
          if (!response.ok) throw new Error("檔案不存在");
          return response.text();
        })
        .then(html => {
          content.innerHTML = html;
        })
        .catch(err => {
          content.innerHTML = `<h1>${page}</h1><p>內容開發中...</p>`;
          console.error(err);
        });
      
      // 切換 active 狀態
      document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
    }

    // ==================== 新增：折疊式選單 (Accordion) ====================
    document.addEventListener('DOMContentLoaded', () => {
      const toggleButtons = document.querySelectorAll('.toggle-btn');
      
      toggleButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          const targetId = btn.getAttribute('data-target');
          const submenu = document.getElementById(targetId);
          
          if (!submenu) return;
          
          // 切換當前選單的展開/收合
          const isOpen = submenu.classList.toggle('open');
          btn.classList.toggle('active', isOpen);
        });
      });
    });
</script>
