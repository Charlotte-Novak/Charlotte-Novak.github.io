<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Python 學習筆記、macOS 使用技巧、與 AI 的討論，以及各種生活碎碎念。記錄真實學習過程、自動化實驗與隨想。">
  <meta name="keywords" content="Python, macOS, DIY, 自動化, AI, 學習筆記">
  <meta name="author" content="Charlotte Novak">
  <title>Charlotte Novak's Python Notes</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Baskerville", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, serif;
      background: url('images/Feather.jpg?20250609') no-repeat center center fixed !important;
      background-size: cover !important;
      color: #333;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
    }

    a { font-family: inherit; }

    .sidebar {
      width: 320px;
      background: rgba(255,255,255,0.1) !important;
      backdrop-filter: blur(6px);
      padding: 24px 0;
      border-right: 1px solid rgba(255,255,255,0.1);
      position: fixed;
      height: 100vh;
      overflow-y: auto;
      z-index: 10;
    }

    .logo { 
      font-size: 1.3rem; 
      font-weight: bold; 
      padding: 0 20px 24px; 
      border-bottom: 1px solid rgba(0,0,0,0.1); 
      margin-bottom: 20px; 
    }

    .nav-link {
      display: block;
      padding: 10px 20px;
      color: #333;
      text-decoration: none;
      font-size: 1rem;
      transition: all 0.2s;
    }

    .nav-link:hover, .nav-link.active {
      background: #9de0fa !important;
      color: white !important;
    }

    .sub { padding-left: 40px; font-size: 0.9rem; }

    .section-title {
      display: block;
      padding: 8px 20px 4px;
      font-size: 1rem;
      color: #555;
    }

    /* --------------- 折疊選單 --------------------------------- */
    .toggle-btn {
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      background: transparent;
      border: none;
      color: inherit;
      font-size: inherit;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: inherit;
    }

    .toggle-btn:hover { background: rgba(255, 255, 255, 0.1); }

    .arrow {
      transition: transform 0.3s ease;
      margin-left: 8px;
      font-size: 0.9em;
      opacity: 0.8;
    }

    .toggle-btn.active .arrow { transform: rotate(180deg); }

    .submenu {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease;
      padding-left: 16px;
      margin-top: 2px;
    }

    .submenu.open { max-height: 400px; }

    .nav-link.sub {
      display: block;
      padding: 6px 12px 6px 28px;
      text-decoration: none;
    }

    /* ----------------------- 右側內容區 --------------------------- */
    main {
      flex: 1;
      margin-left: 320px;
      padding: 40px;
      overflow-y: auto;
    }

    .content-box {
      max-width: 1000px;
      margin-left: 200px;
      padding: 40px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.3);
    }

    .content-title,
    .main-font {
      font-size: 1.3em;
      font-weight: bold;
      margin-bottom: 1.5em;
      font-family: "Baskerville", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", serif;
      /*
      background: rgba(255, 255, 255, 0.9);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);  */
    }

    .main-font {
      font-size: 0.9em;
      font-weight: normal;
    }

    .main-font li {
      margin-bottom: 30px;
      line-height: 1.5;
      padding-left: 4px;
    }

    .grok-icon {
      height: 0.9em;
      width: auto;
      vertical-align: middle;
      margin: 0 1px;
      display: inline-block;
    }
  </style>
</head>
<body>

  <nav class="sidebar">
    <div class="logo">Learning Notes</div>
    
    <a href="#" class="nav-link active" onclick="loadHome()"><b>Top</b></a>

    <div class="nav-section">
      <button class="section-title toggle-btn" data-target="python-submenu">
        <b>Python Notes</b>
        <span class="arrow">▼</span>
      </button>
      <div id="python-submenu" class="submenu">
        <a href="python/basicmenu.html" class="nav-link sub">• 基礎語法</a>
        <a href="#" class="nav-link sub" onclick="loadContent('python-automation')">• 自動化腳本</a>
        <a href="#" class="nav-link sub" onclick="loadContent('python-projects')">• 專案實戰</a>
      </div>
    </div>

    <div class="nav-section">
      <button class="section-title toggle-btn" data-target="mac-submenu">
        <b>MacOS Tricks</b>
        <span class="arrow">▼</span>
      </button>
      <div id="mac-submenu" class="submenu">
        <a href="#" class="nav-link sub" onclick="loadContent('mac-tricks')">• 使用技巧</a>
        <a href="#" class="nav-link sub" onclick="loadContent('mac-automation')">• 自動化工具</a>
      </div>
    </div>

    <a href="#" class="nav-link" onclick="loadContent('thoughts')"><b>Thoughts in a Nutshell</b></a>
    <a href="#" class="nav-link" onclick="loadContent('aboutme')"><b>About Me</b></a>
    
    <a href="https://x.com/CharlotteOTN" target="_blank" class="nav-link">
      <img src="images/x-logo.jpg" alt="X" style="height: 1.35em; width: auto; vertical-align: middle; margin-right: 6px;">
      X / Twitter
    </a>
  </nav>

  <main>
    <br><br>
    <div id="main-content" class="content-box">
      <!-- top.html 會自動載入這裡 -->
    </div>
  </main>

  <script>
    // ==================== 全域變數 ====================
    let homeContent = '';   // 用來保存 top.html 的原始內容，供 loadHome() 切換使用

    // ==================== 載入首頁 (Top) ====================
    function loadTop() {
      const contentArea = document.getElementById('main-content');
      
      fetch('top.html')
        .then(r => {
          if (!r.ok) throw new Error('top.html 載入失敗');
          return r.text();
        })
        .then(html => {
          contentArea.innerHTML = html;
          homeContent = html;           // 保存內容
        })
        .catch(() => {
          contentArea.innerHTML = `<h1>Top</h1><p>top.html 載入失敗，請確認檔案存在。</p>`;
        });
    }

    // ==================== 點擊「Top」時切換回首頁 ====================
    function loadHome() {
      if (homeContent) {
        document.getElementById('main-content').innerHTML = homeContent;
      }
      updateActive('loadHome');
    }

    // ==================== 載入其他頁面內容 (python-automation、thoughts 等) ====================
    function loadContent(page) {
      const contentArea = document.getElementById('main-content');
      
      fetch(`${page}.html`)
        .then(r => {
          if (!r.ok) throw new Error('檔案不存在');
          return r.text();
        })
        .then(html => {
          contentArea.innerHTML = html;
        })
        .catch(() => {
          contentArea.innerHTML = `<h1>${page}</h1><p>內容開發中...</p>`;
        });
      
      updateActive(page);
    }

    // ==================== 更新左側選單的 active 狀態 ====================
    function updateActive(identifier) {
      document.querySelectorAll('.nav-link').forEach(link => {
        link.classList.remove('active');
        if (identifier === 'loadHome' && link.getAttribute('onclick')?.includes('loadHome')) {
          link.classList.add('active');
        }
      });
    }

    // ==================== 頁面初始化 ====================
    document.addEventListener('DOMContentLoaded', () => {
      loadTop();                    // 頁面載入時自動載入 top.html

      // 折疊選單功能
      document.querySelectorAll('.toggle-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const target = document.getElementById(btn.dataset.target);
          if (target) {
            const isOpen = target.classList.toggle('open');
            btn.classList.toggle('active', isOpen);
          }
        });
      });
    });
  </script>
</body>
</html>
