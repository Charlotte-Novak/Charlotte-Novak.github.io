<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charlotte Novak 的學習筆記</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: url('images/Feather.jpg') no-repeat center center fixed !important;
      background-size: cover !important;
      color: #333;
      line-height: 1.6;
      min-height: 100vh;
    }

    .container { display: flex; min-height: 100vh; }

    .sidebar {
      width: 260px;
      background: rgba(255, 255, 255, 0.93);
      backdrop-filter: blur(12px);
      padding: 24px 0;
      border-right: 1px solid rgba(0,0,0,0.1);
      position: fixed;
      height: 100vh;
      overflow-y: auto;
      z-index: 10;
    }

    .content {
      flex: 1;
      margin-left: 260px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.96);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      padding: 0 20px 24px;
      border-bottom: 1px solid #eee;
      margin-bottom: 20px;
      color: #2c3e50;
    }

    .nav-link {
      display: block;
      padding: 10px 20px;
      color: #333;
      text-decoration: none;
      transition: all 0.2s;
    }

    .nav-link:hover, .nav-link.active {
      background: #4A6CF7;
      color: white;
    }

    .section-title {
      display: block;
      padding: 8px 20px 4px;
      font-size: 0.85rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .sub { padding-left: 40px; font-size: 0.95rem; }
  </style>
</head>
<body>
  <div class="container">
    <!-- 左側 Sidebar -->
    <nav class="sidebar">
      <div class="logo">Charlotte's Notes</div>
      
      <a href="#" class="nav-link active" onclick="loadContent('home')">🏠 首頁</a>
      
      <div class="nav-section">
        <span class="section-title">Python 筆記</span>
        <a href="#" class="nav-link sub" onclick="loadContent('python-basics')">• 基礎語法</a>
        <a href="#" class="nav-link sub" onclick="loadContent('python-automation')">• 自動化腳本</a>
        <a href="#" class="nav-link sub" onclick="loadContent('python-projects')">• 專案實戰</a>
      </div>

      <div class="nav-section">
        <span class="section-title">Mac DIY</span>
        <a href="#" class="nav-link sub" onclick="loadContent('mac-tricks')">• 使用技巧</a>
        <a href="#" class="nav-link sub" onclick="loadContent('mac-automation')">• 自動化工具</a>
      </div>

      <a href="#" class="nav-link" onclick="loadContent('thoughts')">💭 碎碎念</a>
      <a href="#" class="nav-link" onclick="loadContent('about')">👤 關於我</a>
    </nav>

    <!-- 右側內容區 -->
    <main class="content" id="main-content">
      <h1>歡迎來到我的學習筆記</h1>
      <p>這裡記錄我學習 Python、Mac DIY 實驗，以及跟 AI 之間的各種吐槽日常。</p>
      <p>網站正在逐步完善中～</p>
    </main>
  </div>

  <script>
    function loadContent(page) {
      const content = document.getElementById('main-content');
      content.innerHTML = `<h1>${page === 'home' ? '歡迎來到我的學習筆記' : page}</h1><p>內容開發中...</p>`;
    }
  </script>
</body>
</html>
