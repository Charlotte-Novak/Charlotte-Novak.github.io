<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Notes</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Baskerville", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, serif;
            background: url("https://charlotte-novak.github.io/images/Feather.jpg?20250609") no-repeat center center fixed;
            background-size: cover;
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
        }

    /* ----------------------- ⬇️ 右方內容區的 Text Format ----------------------------- */

        .content-title {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 1.5em;   /* 控制段落之間的空行 */
            font-family: "Baskerville", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", serif; /* 防止意外 */

            /* 半透明白色背景 + 圓角 + 陰影（如果之後想開）*/
            background: rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        .main-font {
            font-size: 0.9em;
            margin-bottom: 1.5em;   /* 控制段落之間的空行 */
            font-family: "Baskerville", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", serif;

            /* 半透明白色背景 + 圓角 + 陰影（如果之後想開） */
            background: rgba(255, 255, 255, 0.3);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        .main-font li {
            margin-bottom: 30px;           /* 每個list項目之間的間距 */
            line-height: 1.5;              /* 行高，讓文字舒服一點 */
            padding-left: 4px;

        }
    /* ------------------------ ⬆️ 右方內容區的 Text Format ----------------------------------------- */

        /* 統一移除所有連結底線 */
        a {
            text-decoration: none;
            color: #f67300;           /* 你想要的顏色，可以調整 */
        }

        /* hover 時再顯示底線（比較好看） */
        a:hover {
            text-decoration: underline;
        }


        .sidebar {
            width: 320px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(6px);
            padding: 24px 0;
            border-right: 1px solid rgba(255,255,255,0.1);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 10;
        }

        .logo { 
            font-size: 1.3rem; 
            font-weight: bold; 
            padding: 0 20px 24px; 
            border-bottom: 1px solid rgba(0,0,0,0.1); 
            margin-bottom: 20px; 
        }

        .nav-link {
            display: block;
            padding: 10px 20px;
            color: #333;
            text-decoration: none;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .sub { 
            padding-left: 40px; 
            font-size: 0.9rem; 
        }

        .nav-link:hover, .nav-link.active {
            background: #9de0fa !important;
            color: white !important;
        }

        .section-title {
            display: block;
            padding: 8px 20px 4px;
            font-size: 1rem;
            color: #555;
        }

/* ----------------- ⬇️ 接疊menu ------------------------------------------------------ */

.section-title {
  display: block;
  padding: 10px 12px;
  font-weight: bold;
  font-size: 1.05em;
  color: inherit;
}

.toggle-btn {
  width: 100%;
  text-align: left;
  padding: 9px 12px;
  background: transparent;
  border: none;
  color: inherit;
  font-size: 1em;           /* 跟 section-title 接近 */
  font-weight: 600;            /* 稍微粗一點 */
  cursor: pointer;
  border-radius: 4px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: inherit;
}

.toggle-btn:hover {
  background: rgba(255, 255, 255, 0.12);
}

.level2 {
  padding-left: 20px !important;
  font-weight: 500;
}

/* 三級內容 */
.submenu {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s ease;
  padding-left: 12px;
  margin-top: 3px;
}

.submenu.open {
  max-height: 350px;
}

.level3 {
  padding-left: 35px;
}

/* 三級內容 */
.level3-link {
  display: block;
  padding: 5px 12px;
  font-size: 0.98em;
  color: inherit;           /* 改成繼承原本顏色 */
  font-weight: normal;
}

.level3-link:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.08);
}

/* 箭頭 */
.arrow {
  transition: transform 0.3s ease;
  font-size: 0.9em;
  opacity: 0.85;
}

.toggle-btn.active .arrow {
  transform: rotate(180deg);
}

/* 一般子連結（如果還有其他） */
.nav-link.sub {
  display: block;
  text-decoration: none;
}

/* --------------------- ⬆️ 接疊menu end ---------------------------------------------------------- */


        /* 右側內容 */
        main {
            flex: 1;
            margin-left: 450px;
            padding: 40px;
            overflow-y: auto;
        }

        .content-box {
            max-width: 1000px;
            padding: 40px;
            border-radius: 16px;
        }
    </style>
</head>
<body>

    <!-- 左側導航 -->
    <nav class="sidebar">
        <div class="logo">Learning Notes</div>

        <a href="../index.html" class="nav-link active"><b>Top</b></a>

  <!-------------------------------------- ⬇️ 接疊menu -------------------------->

<div class="nav-section">
  <span class="section-title"><b>Python Notes</b></span>
  
  <!-- 二級 -->
  <button class="nav-link sub toggle-btn level2" data-target="basic-submenu">
    • 基礎語法
    <span class="arrow">▼</span>
  </button>
  
  <!-- 三級 -->
  <div id="basic-submenu" class="submenu level3">
    <a href="#" class="nav-link sub level3-link" onclick="loadContent('beginning')">Beginning</a>
    <a href="#" class="nav-link sub level3-link" onclick="loadContent('02')">02</a>
    <a href="#" class="nav-link sub level3-link" onclick="loadContent('03')">03</a>
    <a href="#" class="nav-link sub level3-link" onclick="loadContent('04')">04</a>
  </div>
</div>

   <!-------------------------------------- ⬆️ 接疊menu -------------------------->

    </nav>

    <!-- 右側主要內容 -->
    <main>
        <div id="main-content" class="content-box">
            <!-- JS 會自動載入 beginning.html -->
        </div>
    </main>

<script>
    function loadContent(page) {
        const contentArea = document.getElementById("main-content");
        contentArea.innerHTML = `<p>正在載入 ${page}...</p>`;

        fetch(`./${page}.html`)
            .then(response => {
                if (!response.ok) throw new Error("檔案不存在");
                return response.text();
            })
            .then(html => {
                contentArea.innerHTML = html;
            })
            .catch(err => {
                contentArea.innerHTML = `
                    <h2>內容開發中...</h2>
                    <p>「${page}」的內容正在準備中～</p>
                `;
                console.error(err);
            });
    }

    // ==================== 折疊選單 ====================
    document.addEventListener('DOMContentLoaded', () => {
        // 頁面載入後自動顯示 beginning
        loadContent('beginning');

        // 只給 toggle-btn 綁定事件
        document.querySelectorAll('.toggle-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const targetId = btn.getAttribute('data-target');
                const submenu = document.getElementById(targetId);
                
                if (!submenu) return;

                const isOpen = submenu.classList.toggle('open');
                btn.classList.toggle('active', isOpen);
            });
        });
    });
</script>

</body>
</html>
