    <main>
        
        <div id="main-content" class="content-box" style="margin-top: 60px; margin-bottom: 120px;"></div>

    <script>
        function loadContent(page) {
            const contentArea = document.getElementById("main-content");
            contentArea.innerHTML = `<p style="text-align:center; padding:40px;">正在載入 ${page}...</p>`;

            fetch(`./${page}.html`)
                .then(response => {
                    if (!response.ok) throw new Error("檔案不存在");
                    return response.text();
                })
                .then(html => contentArea.innerHTML = html)
                .catch(err => {
                    contentArea.innerHTML = `<h2>內容開發中...</h2><p>「${page}」的內容正在準備中～</p>`;
                    console.error(err);
                });
        }

            document.addEventListener('DOMContentLoaded', () => {
            loadContent('beginning');

            // 折疊選單
            document.querySelectorAll('.toggle-btn').forEach(btn => {
                const targetId = btn.getAttribute('data-target');
                const submenu = document.getElementById(targetId);
        
        // 預設展開
            if (submenu && btn.classList.contains('active')) {
                submenu.classList.add('open');
                }

            btn.addEventListener('click', () => {
                if (!submenu) return;
                const isOpen = submenu.classList.toggle('open');
                btn.classList.toggle('active', isOpen);
            });
    });
});

        </script>
