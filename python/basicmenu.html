<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Notes - 基礎語法</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Baskerville", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, serif;
            background: url("https://charlotte-novak.github.io/images/Feather.jpg?20250609") no-repeat center center fixed;
            background-size: cover;
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 320px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(6px);
            padding: 24px 0;
            border-right: 1px solid rgba(255,255,255,0.1);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 10;
        }

        .logo { 
            font-size: 1.3rem; 
            font-weight: bold; 
            padding: 0 20px 24px; 
            border-bottom: 1px solid rgba(0,0,0,0.1); 
            margin-bottom: 20px; 
        }

        .nav-link {
            display: block;
            padding: 10px 20px;
            color: #333;
            text-decoration: none;
            font-size: 1rem;
            transition: all 0.2s;
        }

        /* 統一 hover & active 樣式（Top 和其他連結都適用） */
        .nav-link:hover, 
        .nav-link.active,
        .toggle-btn:hover,
        .toggle-btn.active {
            background: #9de0fa !important;
            color: white !important;
        }

        /* ==================== 選單層級樣式 ==================== */
        .section-title {
            display: block;
            padding: 10px 20px 6px;
            font-size: 1.05em;
            font-weight: bold;
            color: #333;
            margin-top: 8px;
        }

        /* 第2級 - 基礎語法 */
        .toggle-btn.level2 {
            padding: 9px 20px 9px 40px !important;
            font-weight: 600;
            font-size: 1em;
            color: #222;
            width: 100%;
            text-align: left;
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 第3級 */
        .level3-link {
            display: block;
            padding: 6px 20px 6px 60px !important;
            font-size: 0.95em;
            color: #444;
            font-weight: normal;
        }

        .level3-link:hover {
            background: #9de0fa !important;
            color: white !important;
        }

        .submenu {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease;
            margin-top: 2px;
        }

        .submenu.open { max-height: 400px; }

        .arrow {
            transition: transform 0.3s ease;
            font-size: 0.9em;
            opacity: 0.85;
            margin-left: auto;
        }

        .toggle-btn.active .arrow {
            transform: rotate(180deg);
        }

        a { text-decoration: none; color: #f67300; }
        a:hover { text-decoration: none; }

        /* ==================== 右側內容區 ==================== */
        main {
            flex: 1;
            margin-left: 320px;
            padding: 40px;
            overflow-y: auto;
        }

        .content-box {
            max-width: 1000px;
            margin-left: 200px;
            padding: 50px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.3) !important;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            min-height: calc(100vh - 80px);
        }

        /* ----------------------- 右方內容區的 Text Format ----------------------------- */

.content-title {
    font-size: 1.3em;
    font-weight: bold;
    margin-bottom: 1.5em;
    font-family: "Baskerville", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", serif;
/*
    background: rgba(255, 255, 255, 0.2);
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);  */
}

.main-font {
    font-size: 0.9em;
    margin-bottom: 1.5em;
    font-family: "Baskerville", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", serif;
/*
    background: rgba(255, 255, 255, 0.3);
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);  */
}

.main-font li {
    margin-bottom: 30px;
    line-height: 1.7;
    padding-left: 4px;
}

/* ------------------------ 右方內容區的 Text Format end ----------------------------------------- */
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="logo">Learning Notes</div>

        <a href="../index.html" class="nav-link"><b>Top</b></a>

        <div class="nav-section">
            <span class="section-title"><b>Python Notes</b></span>
            
            <!-- 第2級 -->
            <button class="toggle-btn level2" data-target="basic-submenu">
                • 基礎語法
                <span class="arrow">▼</span>
            </button>
            
            <!-- 第3級 -->
            <div id="basic-submenu" class="submenu">
                <a href="#" class="level3-link" onclick="loadContent('beginning')">Beginning</a>
                <a href="#" class="level3-link" onclick="loadContent('02')">02</a>
                <a href="#" class="level3-link" onclick="loadContent('03')">03</a>
                <a href="#" class="level3-link" onclick="loadContent('04')">04</a>
            </div>
        </div>
    </nav>

    <main>
        
        <div id="main-content" class="content-box" style="margin-top: 60px; margin-bottom: 120px;"></div>
    </main>

    <script>
        function loadContent(page) {
            const contentArea = document.getElementById("main-content");
            contentArea.innerHTML = `<p style="text-align:center; padding:40px;">正在載入 ${page}...</p>`;

            fetch(`./${page}.html`)
                .then(response => {
                    if (!response.ok) throw new Error("檔案不存在");
                    return response.text();
                })
                .then(html => contentArea.innerHTML = html)
                .catch(err => {
                    contentArea.innerHTML = `<h2>內容開發中...</h2><p>「${page}」的內容正在準備中～</p>`;
                    console.error(err);
                });
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadContent('beginning');

            // 折疊選單
            document.querySelectorAll('.toggle-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const targetId = btn.getAttribute('data-target');
                    const submenu = document.getElementById(targetId);
                    if (!submenu) return;

                    const isOpen = submenu.classList.toggle('open');
                    btn.classList.toggle('active', isOpen);
                });
            });
        });
    </script>
</body>
</html>
