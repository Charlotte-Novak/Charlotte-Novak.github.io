<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Notes</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Baskerville", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, serif;
            background: url("https://charlotte-novak.github.io/images/Feather.jpg?20250609") no-repeat center center fixed;
            background-size: cover;
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
        }

        /* Text Format */

        .content-title {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 1.5em;   /* 控制段落之間的空行 */
            font-family: "Baskerville", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", serif; /* 防止意外 */

            /* 半透明白色背景 + 圓角 + 陰影（如果之後想開）*/
            background: rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        .content-01 {
            font-size: 0.9em;
            margin-bottom: 1.5em;   /* 控制段落之間的空行 */
            font-family: "Baskerville", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", serif;

            /* 半透明白色背景 + 圓角 + 陰影（如果之後想開） */
            background: rgba(255, 255, 255, 0.4);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        .content-01 li {
            margin-bottom: 25px;           /* 每個list項目之間的間距 */
            line-height: 2.5;              /* 行高，讓文字舒服一點 */
            padding-left: 4px;

        }




        .sidebar {
            width: 280px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(6px);
            padding: 24px 0;
            border-right: 1px solid rgba(255,255,255,0.1);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 10;
        }

        .logo { 
            font-size: 1.3rem; 
            font-weight: bold; 
            padding: 0 20px 24px; 
            border-bottom: 1px solid rgba(0,0,0,0.1); 
            margin-bottom: 20px; 
        }

        .nav-link {
            display: block;
            padding: 10px 20px;
            color: #333;
            text-decoration: none;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .sub { 
            padding-left: 40px; 
            font-size: 0.9rem; 
        }

        .nav-link:hover, .nav-link.active {
            background: #9de0fa !important;
            color: white !important;
        }

        .section-title {
            display: block;
            padding: 8px 20px 4px;
            font-size: 1rem;
            color: #555;
        }

        /* 右側內容 */
        main {
            flex: 1;
            margin-left: 280px;
            padding: 40px;
            overflow-y: auto;
        }

        .content-box {
            max-width: 820px;
            padding: 40px;
            border-radius: 16px;
        }
    </style>
</head>
<body>

    <!-- 左側導航 -->
    <nav class="sidebar">
        <div class="logo">Learning Notes</div>

        <a href="https://charlotte-novak.github.io/" class="nav-link active"><b>Top</b></a>

        <div class="nav-section">
            <span class="section-title"><b>Python Notes</b></span>
            <a href="#" class="nav-link sub" onclick="loadContent('beginning')">• 基礎語法</a>
            <a href="#" class="nav-link sub" onclick="loadContent('beginning')">Beginning</a>
            <a href="#" class="nav-link sub" onclick="loadContent('02')">02</a>
            <a href="#" class="nav-link sub" onclick="loadContent('03')">03</a>
            <a href="#" class="nav-link sub" onclick="loadContent('04')">04</a>
        </div>
    </nav>

    <!-- 右側主要內容 -->
    <main>
        <div id="main-content" class="content-box">
            <!-- JS 會自動載入 beginning.html -->
        </div>
    </main>

    <script>
        function loadContent(page) {
            const contentArea = document.getElementById("main-content");
            contentArea.innerHTML = `<p>正在載入 ${page}...</p>`;

            fetch(`./${page}.html`)
                .then(response => {
                    if (!response.ok) throw new Error("檔案不存在");
                    return response.text();
                })
                .then(html => {
                    contentArea.innerHTML = html;
                })
                .catch(err => {
                    contentArea.innerHTML = `
                        <h2>內容開發中...</h2>
                        <p>「${page}」的內容正在準備中～</p>
                    `;
                    console.error(err);
                });
        }

        // 頁面載入後自動顯示 beginning
        document.addEventListener('DOMContentLoaded', () => loadContent('beginning'));
    </script>
</body>
</html>
