    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Baskerville", "LiSong Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, serif;
            background: url("../images/Feather.jpg") no-repeat center center fixed;

        .sidebar {
            width: 320px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(6px);

            border-right: 1px solid rgba(255,255,255,0.1);

            height: 100vh;
            overflow-y: auto;
            z-index: 10;

        .logo { 
            font-size: 1.3rem; 
            font-weight: bold; 
            padding: 0 20px 24px;

            margin-bottom: 20px; 
        }

        .nav-link {

            font-size: 1rem;
            transition: all 0.2s;
        }

        /* 統一 hover & active 樣式（Top 和其他連結都適用） */
        .nav-link:hover, 
        .nav-link.active,
        .toggle-btn:hover,
        .toggle-btn.active {
            background: #9de0fa !important;
            color: white !important;
        }

        /* ==================== 選單層級樣式 ==================== */
        .section-title {
            display: block;
            padding: 10px 20px 6px;
            font-size: 1.05em;
            font-weight: bold;
            color: #333;
            margin-top: 8px;
        }

        /* 第2級 - 基礎語法 */
        .toggle-btn.level2 {
            padding: 9px 20px 9px 40px !important;
            font-weight: 600;
            font-size: 1em;
            color: #222;
            width: 100%;
            text-align: left;
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 第3級 */
        .level3-link {
            display: block;
            padding: 6px 20px 6px 60px !important;
            font-size: 0.95em;
            color: #444;
            font-weight: normal;
        }

        .level3-link:hover {
            background: #9de0fa !important;
            color: white !important;
        }

        .submenu {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease;
            margin-top: 2px;
        }

        .submenu.open { 
            max-height: none;           /* 取消高度限制，讓它自動撐開 */
            overflow: visible;          /* 確保不會被切掉 */
            transition: max-height 0.4s ease;  /* 保留展開動畫 */ 
        }

        .arrow {
            transition: transform 0.3s ease;
            font-size: 0.9em;
            opacity: 0.85;
            margin-left: auto;
        }

        .toggle-btn.active .arrow {
            transform: rotate(180deg);
        }

        a { text-decoration: none; color: #f67300; }
        a:hover { text-decoration: none; }

        /* ==================== 右側內容區 ==================== */
        main {
            flex: 1;
            margin-left: 200px;

        }

            max-width: 1000px;

        /* ------------- 右方內容區的 Text Format -------------- */

.content-title {

/* ==================== 新增：中文專用 LiSong Pro ==================== */
    :lang(zh-HK), :lang(zh-TW), :lang(zh) {

    }

 /* ===================== 右方內容局部左右並列 ======================== */
    .code-explain {
        display: flex;              /* 這一行最重要！讓子元素並排 */
        align-items: center;        /* 垂直置中對齊 */
        gap: 15px;                  /* 左右間距 */
        flex-wrap: wrap;            /* 小螢幕時自動換行 */
        margin: 5px 0;           /* 上下間距 */
        padding: 4px 0;           /* 輔助用，幫助阻斷 collapse */
    }

    .code-left {
        font-weight: bold;
        background: rgba(255, 255, 255, 0);
        padding: 12px 20px;
        border-radius: 8px;
        flex: 0 0 auto;             /* 程式碼區不被壓縮 */
        white-space: pre-wrap;

    }

    .explain-right {
        background: rgba(1, 196, 255, 0.2);
        padding: 12px 20px;
        border-radius: 8px;
        flex: 1;                    /* 佔據剩餘空間 */

/* 如果想讓程式碼區固定寬度 */

<body>

    <nav class="sidebar">
        <div class="logo">Learning Notes</div>

        <a href="../index.html" class="nav-link"><b>Top</b></a>

        <div class="nav-section">
            <span class="section-title"><b>Python Notes</b></span>
            
            <!-- 第2級 -->
            <button class="toggle-btn level2 active" data-target="basic-submenu">
                • 基礎語法
                <span class="arrow">▼</span>
            </button>
            
            <!-- 第3級 -->
            <div id="basic-submenu" class="submenu open">

                <a href="#" class="level3-link" onclick="loadContent('beginning')">Beginning</a>

                <a href="#" class="level3-link" onclick="loadContent('input')">input</a>

                <a href="#" class="level3-link" onclick="loadContent('datatypes-01')">Basic Data Types</a>
                <a href="#" class="level3-link" onclick="loadContent('mix-01')">Vars, Input & Data Types</a>
                <a href="#" class="level3-link" onclick="loadContent('roundabs')">round , abs</a>
                <a href="#" class="level3-link" onclick="loadContent('binary')">binary</a>

            <span class="chapter-label">Chapter 2：</span>

                <a href="#" class="level3-link" onclick="loadContent('boolean')">Boolean Values</a>


            </div>
        </div>
    </nav>

    <main>
        
        <div id="main-content" class="content-box" style="margin-top: 60px; margin-bottom: 120px;"></div>
    </main>

    <script>
        function loadContent(page) {
            const contentArea = document.getElementById("main-content");
            contentArea.innerHTML = `<p style="text-align:center; padding:40px;">正在載入 ${page}...</p>`;

            fetch(`./${page}.html`)
                .then(response => {
                    if (!response.ok) throw new Error("檔案不存在");
                    return response.text();
                })
                .then(html => contentArea.innerHTML = html)
                .catch(err => {
                    contentArea.innerHTML = `<h2>內容開發中...</h2><p>「${page}」的內容正在準備中～</p>`;
                    console.error(err);
                });
        }

            document.addEventListener('DOMContentLoaded', () => {
            loadContent('beginning');

            // 折疊選單
            document.querySelectorAll('.toggle-btn').forEach(btn => {
                const targetId = btn.getAttribute('data-target');
                const submenu = document.getElementById(targetId);
        
        // 預設展開
            if (submenu && btn.classList.contains('active')) {
                submenu.classList.add('open');
                }

            btn.addEventListener('click', () => {
                if (!submenu) return;
                const isOpen = submenu.classList.toggle('open');
                btn.classList.toggle('active', isOpen);
            });
    });
});

        </script>
    </body>
</html>
