<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Notes</title>
    <style>
        body {
            font-family: "Baskerville", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, serif;
            background-image: url("https://charlotte-novak.github.io/images/Feather.jpg?20250609");
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            color: #333;
            line-height: 1.6;
        }

        /* 左側選單 */

        .logo { 
            font-size: 1.3rem; 
            font-weight: bold; 
            padding: 0 20px 24px; 
            border-bottom: 1px solid rgba(0,0,0,0.1); 
            margin-bottom: 20px; 
        }

        nav.sidebar {
            width: 280px;
            background-color: rgba(255, 255, 255, 0.2);
            padding: 20px 0;
            overflow-y: auto;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }

        .nav-link {
            display: block;
            padding: 10px 20px;
            color: #333;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .sub { padding-left: 40px; font-size: 0.8rem; }

        .nav-link:hover, .nav-link.active {
            background: #9de0fa !important;
            color: white !important;
        }

        /* 右側內容 */
        main {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .content-box {
            max-width: 820px;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .section-title {
            display: block;
            padding: 8px 20px 4px;
            font-size: 0.9rem;
            color: #555;
        }
    </style>
</head>
<body>

    <!-- 左側導航 -->
    <nav class="sidebar">
        
        <div class="logo">Learning Notes</div>

        <a href="https://charlotte-novak.github.io/" class="nav-link active"><b>Top</b></a>


        <span class="section-title"><b>Python Notes</b></span>
        <ul style="list-style: none; padding: 0; margin: 0;">
            <li><span class="section-title"><b>• 基礎語法</b></span></li>
            <li><a href="#" class="nav-link sub" onclick="loadContent('01')">01</a></li>
            <li><a href="#" class="nav-link sub" onclick="loadContent('02')">02</a></li>
            <li><a href="#" class="nav-link sub" onclick="loadContent('03')">03</a></li>
            <li><a href="#" class="nav-link sub" onclick="loadContent('04')">04</a></li>
        </ul>
    </nav>

    <!-- 右側主要內容 -->
    <main>
        <div id="main-content" class="content-box">
            <!-- JS 會自動載入 01.html 內容 -->
        </div>
    </main>

    <script>
        function loadContent(page) {
            const contentArea = document.getElementById("main-content");
            contentArea.innerHTML = `<p>正在載入 ${page}...</p>`;

            fetch(`./${page}.html`)
                .then(response => {
                    if (!response.ok) throw new Error("檔案不存在");
                    return response.text();
                })
                .then(html => {
                    contentArea.innerHTML = html;
                })
                .catch(err => {
                    contentArea.innerHTML = `
                        <div class="content-box">
                            <h2>內容開發中...</h2>
                            <p>「${page}」的內容正在準備中～</p>
                        </div>
                    `;
                    console.error(err);
                });
        }

        document.addEventListener('DOMContentLoaded', () => loadContent('01'));
    </script>
</body>
</html>
