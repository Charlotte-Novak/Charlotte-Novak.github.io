<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Notes</title>
    <style>
        body {
            font-family: "Baskerville", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, serif;
            background-image: url("https://charlotte-novak.github.io/images/Feather.jpg?20250609");
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            color: #333;
            line-height: 1.6;
        }

        /* 左側選單 */
        .sidebar {
            width: 280px;
            background-color: rgba(255, 255, 255, 0.2);
            padding: 20px 0;
            overflow-y: auto;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }

        .nav-link {
            display: block;
            padding: 10px 20px;
            color: #333;
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .sub {
            padding-left: 40px;
            font-size: 0.7rem;
        }

        .nav-link:hover, 
        .nav-link.active {
            background: #9de0fa !important;
            color: white !important;
        }

        .sidebar h2 {
            padding: 0 20px 8px 20px;
            margin: 15px 0 5px 0;
            color: #333;
            font-size: 1rem;
        }
        
        .top-link {
            padding: 10px 20px;
            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
            display: block;
        }

        /* 右側內容 */
        .main-content {
         flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .content-box {
            max-width: 820px;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        
    </style>
</head>
<body>

    <!-- 左側選單 -->
    <nav class="sidebar">
        <div class="menu">
            <!-- Top -->
            <a href="https://charlotte-novak.github.io/" class="top-link">Top</a>

            <h2>Python Notes</h2>
            <ul style="list-style: none; padding: 0; margin: 0;">
                <li><span class="nav-link" style="cursor: default;">• 基礎語法</span></li>
                <li><a href="#" class="nav-link sub" onclick="loadContent('01')">01</a></li>
                <li><a href="#" class="nav-link sub" onclick="loadContent('02')">02</a></li>
                <li><a href="#" class="nav-link sub" onclick="loadContent('03')">03</a></li>
                <li><a href="#" class="nav-link sub" onclick="loadContent('04')">04</a></li>
                <!-- 之後幾十個就繼續照這個格式加 -->
            </ul>

            
        </div>
    </nav>

    <!-- 右側內容區 -->
    <div class="main-content">
        <div class="content-box" id="main-content">
            <h2>In learning's sea, no shore in sight,</h2>
            <h2>Turn back, and land is pure delight.</h2>
            <br><br><br>
            <p>請從左側選單選擇主題</p>
        </div>
    </div>

    <script>
        function loadContent(page) {
            const contentArea = document.getElementById("main-content");
            contentArea.innerHTML = `<p>正在載入 ${page}...</p>`;

            fetch(`./${page}.html`)
                .then(response => {
                    if (!response.ok) throw new Error("檔案不存在");
                    return response.text();
                })
                .then(html => {
                    contentArea.innerHTML = html;
                })
                .catch(err => {
                    contentArea.innerHTML = `
                        <h2>內容開發中...</h2>
                        <p>「${page}」的內容正在準備中～</p>
                    `;
                });
        }
    </script>
</body>
</html>
