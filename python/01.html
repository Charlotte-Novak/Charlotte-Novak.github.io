<pre>
    實用文字大小單位推薦（2026最新）

rem → 最推薦（相對於根元素，響應式好）
em → 相對於父元素
px → 固定大小（不建議大量使用）
% → 百分比

範例：

font-size: 1.2rem;（比預設大一點）
font-size: 18px;（固定大小）
font-size: 120%;（相對大小）
