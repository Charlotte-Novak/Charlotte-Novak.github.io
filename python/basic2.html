<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Notes</title>
    <style>
        body {
            font-family: "Baskerville", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, serif;
            background-image: url("../images/feather.jpg?20250609");
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
        }

        /* 左側選單 */
        .sidebar {
            width: 280px;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 20px 0;
            overflow-y: auto;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }

        .sidebar h2 {
            padding: 0 20px;
            background-color: rgba(255, 255, 255, 0.1);
            margin: 10px 0;
            color: #333;
        }

        .menu ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .menu li {
            padding: 8px 20px;
        }

        .menu a {
            color: #333;
            text-decoration: none;
            display: block;
        }

        .menu a:hover {
            color: #0066cc;
        }

        /* 子項目縮排 */
        .submenu {
            padding-left: 30px;
        }

        /* 右側內容區 */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .content-box {
            max-width: 820px;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <!-- 左側選單 -->
    <nav class="sidebar">
        <div class="menu">
            <h2>Python Notes</h2>
            <ul>
                <li><a href="#" onclick="loadContent('python-basics')">• 基礎語法</a></li>
                <li><a href="#" onclick="loadContent('01')">01 - 第一個主題</a></li>
                <li><a href="#" onclick="loadContent('02')">02 - 第二個主題</a></li>
                <li><a href="#" onclick="loadContent('03')">03 - 第三個主題</a></li>
                <!-- 之後幾十個就繼續這樣加 -->
            </ul>

            <h2>MacOS Tricks</h2>
            <ul>
                <li><a href="#" onclick="loadContent('mac-shortcuts')">• 使用技巧</a></li>
                <li><a href="#" onclick="loadContent('automation')">• 自動化工具</a></li>
            </ul>

            <h2>其他</h2>
            <ul>
                <li><a href="#" onclick="loadContent('about')">About Me</a></li>
            </ul>
        </div>
    </nav>

    <!-- 右側內容區 -->
    <div class="main-content">
        <div class="content-box" id="main-content">
            <!-- 預設內容 -->
            <h1>In learning's sea, no shore in sight,</h1>
            <h2>Turn back, and land is pure delight.</h2>
            <p>請從左側選單選擇主題</p>
        </div>
    </div>

    <script>
        function loadContent(page) {
            const contentArea = document.getElementById("main-content");
            
            contentArea.innerHTML = `<p>正在載入 ${page}...</p>`;

            fetch(`./${page}.html`)
                .then(response => {
                    if (!response.ok) throw new Error("檔案不存在");
                    return response.text();
                })
                .then(html => {
                    contentArea.innerHTML = html;
                })
                .catch(err => {
                    contentArea.innerHTML = `
                        <h2>內容開發中...</h2>
                        <p>「${page}」的內容正在準備中～</p>
                    `;
                });
        }
    </script>
</body>
</html>
