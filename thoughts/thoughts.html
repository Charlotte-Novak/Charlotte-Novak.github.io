<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Python 學習筆記、macOS 使用技巧、與 AI 的討論，以及各種生活碎碎念。記錄真實學習過程、自動化實驗與隨想。">
  <meta name="keywords" content="Python, macOS, DIY, 自動化, AI, 學習筆記">
  <meta name="author" content="Charlotte Novak">
  <title>Charlotte Novak's Python Notes</title>
  
  <link rel="stylesheet" href="../common.css">


  <style>
</style>
</head>
<body>

  <nav class="sidebar">
    <div class="logo">Learning Notes</div>
    
    <a href="../index.html" class="nav-link active" onclick="loadHome()"><b>Top</b></a>

    <div class="nav-section">
      <button class="section-title toggle-btn active" data-target="python-submenu">
        <b>Thoughts in a Nutshell</b>
        <span class="arrow">▼</span>
    </button>
    <div id="python-submenu" class="submenu open">
      
        <a href="#" class="nav-link sub" onclick="loadContent('20260723')">• Grok 4.5 Style Anchoring Effect</a>
        <a href="#" class="nav-link sub" onclick="loadContent('20260810')">• Thoughts on AI collaboration</a>
        <a href="#" class="nav-link sub" onclick="loadContent('12062026')">• 12/06/2026</a>
      </div>
    </div>
    
  </nav>

  <main>
    
    <div id="main-content" class="content-box" style="margin-top: 60px; margin-bottom: 120px;">
      <!-- thoughtstop.html 會自動載入這裡 -->
    </div>
  </main>

  <script>
  // ==================== 全域變數 ====================
  let homeContent = '';   // 用來保存 thoughtstop.html 的原始內容

  // ==================== 載入首頁 (Top) ====================
  function loadTop() {
    const contentArea = document.getElementById('main-content');
    
    fetch('thoughtstop.html')
      .then(r => {
        if (!r.ok) throw new Error(`HTTP error! status: ${r.status}`);
        return r.text();
      })
      .then(html => {
        contentArea.innerHTML = html;
        homeContent = html;           // 保存內容
      })
      .catch(err => {
        console.error(err);
        contentArea.innerHTML = `<h1>載入失敗</h1><p>thoughtstop.html 載入失敗，請確認檔案存在。</p>`;
      });
  }

  // ==================== 點擊「Top」時切換回首頁 ====================
  function loadHome() {
    if (homeContent) {
      document.getElementById('main-content').innerHTML = homeContent;
    }
    updateActive('loadHome');
  }

  // ==================== 載入其他頁面內容 ====================
  function loadContent(page) {
    const contentArea = document.getElementById('main-content');
    
    fetch(`${page}.html`)
      .then(r => {
        if (!r.ok) throw new Error('檔案不存在');
        return r.text();
      })
      .then(html => {
        contentArea.innerHTML = html;
      })
      .catch(() => {
        contentArea.innerHTML = `<h1>${page}</h1><p>內容開發中...</p>`;
      });
    
    updateActive(page);
  }

  // ==================== 更新左側選單 active 狀態 ====================
  function updateActive(identifier) {
    document.querySelectorAll('.nav-link').forEach(link => {
      link.classList.remove('active');
      if (identifier === 'loadHome' && link.getAttribute('onclick')?.includes('loadHome')) {
        link.classList.add('active');
      }
    });
  }

  // ==================== 頁面初始化 ====================
  document.addEventListener('DOMContentLoaded', () => {
    loadTop();                    // 自動載入 thoughtstop.html

    // ==================== 折疊選單功能（預設展開） ====================
    document.querySelectorAll('.toggle-btn').forEach(btn => {
      const target = document.getElementById(btn.dataset.target);
      
      // 預設展開
      if (target) {
        target.classList.add('open');
        btn.classList.add('active');
      }

      btn.addEventListener('click', () => {
        if (target) {
          const isOpen = target.classList.toggle('open');
          btn.classList.toggle('active', isOpen);
        }
      });
    });
  });
</script>
</body>
</html>
